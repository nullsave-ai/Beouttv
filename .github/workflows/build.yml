name: Build BeoutTV Universal APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleRelease --stacktrace

          WORKSPACE_DIR=$PWD
          mkdir -p "$WORKSPACE_DIR/dist"
          
          # Find and copy generated release APK
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} "$WORKSPACE_DIR/dist/BeoutTV-Universal-v3.0.apk" \;
          ls -lh "$WORKSPACE_DIR/dist/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BeoutTV_apk
          path: dist/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: "BeoutTV Universal v3.0.${{ github.run_number }} (Release)"
          body: |
            ### تطبيق BeoutTV Universal v3.0:
            * إضافة خيار التحكم في الفلتر الأخلاقي (+18) من الإعدادات (تفعيل أو إلغاء تفعيل) للهواتف والشاشات الذكية.
            * دعم كامل لنمط الشاشات الذكية والهواتف وتوافق شامل مع جميع المعماريات.
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
