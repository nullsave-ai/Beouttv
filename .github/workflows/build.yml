name: Build BeoutTV Universal APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Keystore & Signing Secrets
        run: |
          # 1. Restore release.keystore from Secret if configured
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring release.keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          fi

          # 2. Configure release.properties from Secrets if configured
          if [ -n "${{ secrets.KEYSTORE_STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEYSTORE_KEY_ALIAS }}" ]; then
            echo "Generating release.properties from GitHub Secrets..."
            cat <<EOF > release.properties
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          storeFile=release.keystore
          EOF
          fi

          # 3. Restore google-services.json if provided in Secrets
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "Restoring google-services.json from GitHub Secrets..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
          fi

      - name: Build Release APK
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleRelease --stacktrace

          WORKSPACE_DIR=$PWD
          mkdir -p "$WORKSPACE_DIR/dist"
          
          # Find and copy generated release APK
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} "$WORKSPACE_DIR/dist/BeoutTV-Universal-v3.0.apk" \;
          ls -lh "$WORKSPACE_DIR/dist/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BeoutTV_apk
          path: dist/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: "BeoutTV Universal v3.0.${{ github.run_number }} (Release)"
          body: |
            ### 🚀 تحديث BeoutTV الجديد المرتبط بلوحة تحكم السحابة (apklive):
            * **الربط المباشر مع لوحة تحكم السحابة**: مزامنة تلقائية للقنوات والمباريات والباقات من لوحة التحكم السحابية الموحدة (`https://oneplus-admin.web.app`).
            * **محرك مشغل ذكي متطور**: دعم كامل لتشغيل كافة صيغ البث المباشر والقنوات الرياضية (HLS / DASH / Referer Headers) بسلاسة وثبات عالي.
            * **واجهة زجاجية عصرية فائقة السرعة**: مبنية بأحدث تقنيات Jetpack Compose بدون أي تعليق لخفة فائقة واستهلاك موارد شبه معدوم.
            * **توافق كامل مع الهواتف والشاشات الذكية**: دعم نظام Android TV / Smart TV / TV Box والهواتف الذكية مع التحكم الكامل بريموت التلفاز.
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
